<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0E2024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wassaf">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>وصّاف · Wassaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E2024; --bg2:#0A1719; --surface:#173033; --card:#1C3A3E; --line:#2C4E52;
  --ink:#EAF5F3; --ink-dim:#8FB3B0;
  --accent:#FF4D8D; --accent-soft:#FF7BAA;
  --gold:#FFC857;
  --success:#4ADE80; --danger:#F87171;
  --font-d:'Cairo',sans-serif; --font-b:'Tajawal',sans-serif; --font-lat:'Poppins',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);}
html[lang="en"] body,html[lang="fr"] body,html[lang="es"] body{font-family:var(--font-lat);}
h1,h2,h3{font-family:var(--font-d);}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,
html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3,
html[lang="es"] h1,html[lang="es"] h2,html[lang="es"] h3{font-family:var(--font-lat);font-weight:800;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

.topbar{padding:16px 18px;background:linear-gradient(180deg,#173538,var(--bg));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--accent-soft),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-name{font-weight:800;font-size:18px;}
.langbox select{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700;
}

.hero{padding:34px 20px 26px;text-align:center;background:radial-gradient(120% 100% at 50% 0%, #1E4448 0%, var(--bg) 70%);}
.hero h1{margin:0 0 8px;font-size:26px;font-weight:800;line-height:1.35;}
.hero h1 span{color:var(--accent-soft);}
.hero p{margin:0 auto;max-width:420px;font-size:14px;color:var(--ink-dim);line-height:1.7;}
.feature-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.feature-chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}

.wrap{max-width:600px;margin:0 auto;padding:0 16px 50px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:-8px;margin-bottom:16px;position:relative;}
.section-title{font-size:14px;color:var(--accent-soft);font-weight:700;margin:2px 0 12px;display:flex;align-items:center;gap:6px;}
label{display:block;font-size:12px;color:var(--ink-dim);margin:11px 0 5px;font-weight:700;}
input[type=text],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:10px 12px;font-size:14px;
}
textarea{min-height:80px;resize:vertical;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}

.tonegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px;}
.tone-opt{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);font-weight:700;font-size:12.5px;text-align:center;}
.tone-opt.active{border-color:var(--accent);background:rgba(255,77,141,0.14);color:var(--accent-soft);}

.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-accent{background:linear-gradient(155deg,var(--accent-soft),var(--accent));color:#3A0018;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55;pointer-events:none;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 13px;font-size:12.5px;font-weight:700;border-radius:9px;}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#3A0018;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.err{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.35);color:var(--danger);padding:10px 12px;border-radius:10px;font-size:12.5px;margin-top:12px;}

.results{display:none;margin-top:6px;}
.results.show{display:block;}
.out-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;}
.out-head h3{margin:0;font-size:13.5px;color:var(--gold);}
.out-body{font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:var(--ink);}
.kw-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.kw{background:rgba(255,200,87,0.12);color:var(--gold);border:1px solid rgba(255,200,87,0.3);padding:4px 10px;border-radius:14px;font-size:11.5px;font-weight:700;}
.bullets{margin:0;padding-inline-start:18px;}
.bullets li{margin-bottom:6px;line-height:1.7;}
.copied{color:var(--success)!important;}
.hint{font-size:11.5px;color:var(--ink-dim);margin-top:6px;line-height:1.7;text-align:center;}
.ad-image{width:100%;border-radius:12px;display:block;margin-top:12px;border:1px solid var(--line);}
.img-loading{font-size:12.5px;color:var(--ink-dim);text-align:center;margin-top:10px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">📝</div>
    <div class="brand-name">وصّاف</div>
  </div>
  <div class="langbox">
    <select id="langSwitch" onchange="setLanguage(this.value)">
      <option value="ar">🇪🇬 العربية</option>
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
    </select>
  </div>
</div>

<div class="hero">
  <h1 data-i18n="heroTitle"></h1>
  <p data-i18n="heroSubtitle"></p>
  <div class="feature-row">
    <div class="feature-chip">🔍 <span data-i18n="feature1"></span></div>
    <div class="feature-chip">🌍 <span data-i18n="feature2"></span></div>
    <div class="feature-chip">⚡ <span data-i18n="feature3"></span></div>
  </div>
</div>

<div class="wrap" style="padding-bottom:0;">
  <div style="display:flex;gap:8px;margin-top:-8px;margin-bottom:14px;">
    <button type="button" class="tone-opt active" id="pageTabForm" onclick="switchPage('form')" style="flex:1;" data-i18n="tabForm"></button>
    <button type="button" class="tone-opt" id="pageTabPhoto" onclick="switchPage('photo')" style="flex:1;" data-i18n="tabPhoto"></button>
  </div>
</div>

<div class="wrap" id="pageForm">
  <div class="card">
    <div class="section-title">📦 <span data-i18n="sectionProduct"></span></div>

    <label data-i18n="labelName"></label>
    <input type="text" id="pName" data-i18n-ph="placeholderName">

    <label data-i18n="labelCategory"></label>
    <select id="pCategory"></select>

    <label data-i18n="labelFeatures"></label>
    <textarea id="pFeatures" data-i18n-ph="placeholderFeatures"></textarea>

    <label data-i18n="labelAudience"></label>
    <input type="text" id="pAudience" data-i18n-ph="placeholderAudience">

    <label data-i18n="labelTone"></label>
    <div class="tonegrid" id="toneGrid"></div>

    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="generateContent()" id="genBtn">
      <span class="btn-label" data-i18n="btnGenerate"></span>
    </button>
    <div class="err" id="genErr" style="display:none;"></div>
  </div>

  <div class="out-card">
    <div class="out-head"><h3 data-i18n="imgCardTitle"></h3></div>
    <div class="tonegrid" style="margin-bottom:10px;">
      <button type="button" class="tone-opt active" id="imgTypeAd" onclick="pickImageType('ad')" data-i18n="imgTypeAd"></button>
      <button type="button" class="tone-opt" id="imgTypeLogo" onclick="pickImageType('logo')" data-i18n="imgTypeLogo"></button>
    </div>
    <label data-i18n="imgUploadLabel" style="color:var(--gold);"></label>
    <input type="file" accept="image/*" id="productPhoto" style="margin-bottom:12px;">
    <button class="btn btn-accent btn-block" onclick="generateImage()" id="imgBtn"><span data-i18n="btnGenImage"></span></button>
    <div class="img-loading" id="imgLoading" style="display:none;"></div>
    <img class="ad-image" id="adImage" style="display:none;">
  </div>

  <div class="results" id="results">
    <button class="btn btn-accent btn-block" style="margin-bottom:12px;" onclick="speakText([document.getElementById('seoOut').textContent, document.getElementById('bulletsPlainHidden').textContent, document.getElementById('fbOut').textContent, document.getElementById('tiktokOut').textContent].join('. '))">🔊 <span data-i18n="btnSpeakAll"></span></button>
    <div class="out-card">
      <div class="out-head"><h3><span data-i18n="outSeoTitle"></span></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('seoOut').textContent)" id="s1">🔊</button><button class="btn-outline" onclick="copyOut('seoOut','c1')" id="c1" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="seoOut"></div>
      <div class="kw-wrap" id="kwWrap"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3><span data-i18n="outBulletsTitle"></span></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('bulletsPlainHidden').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('bulletsPlainHidden','c2')" id="c2" data-i18n="btnCopy"></button></div></div>
      <ul class="bullets" id="bulletsOut"></ul>
      <div id="bulletsPlainHidden" style="display:none;"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3><span data-i18n="outFbTitle"></span></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('fbOut').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('fbOut','c3')" id="c3" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="fbOut"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3><span data-i18n="outTiktokTitle"></span></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('tiktokOut').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('tiktokOut','c4')" id="c4" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="tiktokOut"></div>
    </div>

    <div class="hint" data-i18n="footerHint"></div>
  </div>
</div>

<div class="wrap" id="pagePhoto" style="display:none;">
  <div class="card">
    <div class="section-title" data-i18n="photoSectionTitle"></div>
    <label data-i18n="photoUploadLabel"></label>
    <input type="file" accept="image/*" id="photoOnlyInput">
    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="analyzeFromPhoto()" id="analyzeBtn">
      <span class="btn-label" id="analyzeBtnLabel" data-i18n="btnAnalyze"></span>
    </button>
    <div class="err" id="analyzeErr" style="display:none;"></div>
  </div>

  <div class="results" id="photoResults">
    <button class="btn btn-accent btn-block" style="margin-bottom:12px;" onclick="speakText([document.getElementById('photoSeoOut').textContent, document.getElementById('photoBulletsPlainHidden').textContent, document.getElementById('photoFbOut').textContent, document.getElementById('photoTiktokOut').textContent].join('. '))">🔊 <span data-i18n="btnSpeakAll"></span></button>
    <div class="out-card">
      <div class="out-head"><h3 data-i18n="imgCardTitle"></h3></div>
      <div class="img-loading" id="photoImgLoading" style="display:none;"></div>
      <img class="ad-image" id="photoAdImage" style="display:none;">
    </div>

    <div class="out-card">
      <div class="out-head"><h3 data-i18n="outSeoTitle"></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('photoSeoOut').textContent)" id="ps1">🔊</button><button class="btn-outline" onclick="copyOut('photoSeoOut','pc1')" id="pc1" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="photoSeoOut"></div>
      <div class="kw-wrap" id="photoKwWrap"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3 data-i18n="outBulletsTitle"></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('photoBulletsPlainHidden').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('photoBulletsPlainHidden','pc2')" id="pc2" data-i18n="btnCopy"></button></div></div>
      <ul class="bullets" id="photoBulletsOut"></ul>
      <div id="photoBulletsPlainHidden" style="display:none;"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3 data-i18n="outFbTitle"></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('photoFbOut').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('photoFbOut','pc3')" id="pc3" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="photoFbOut"></div>
    </div>

    <div class="out-card">
      <div class="out-head"><h3 data-i18n="outTiktokTitle"></h3><div style="display:flex;gap:6px;"><button class="btn-outline" onclick="speakText(document.getElementById('photoTiktokOut').textContent)">🔊</button><button class="btn-outline" onclick="copyOut('photoTiktokOut','pc4')" id="pc4" data-i18n="btnCopy"></button></div></div>
      <div class="out-body" id="photoTiktokOut"></div>
    </div>
  </div>
</div>

const categoriesEn = ['fashion','electronics','cosmetics','home appliance','food or beverage','accessory','digital tech gadget','product'];
function isMostlyLatin(str){
  if(!str) return false;
  const nonLatin = (str.match(/[^\x00-\x7F]/g)||[]).length;
  return nonLatin < str.length * 0.3;
}

let currentLang = 'ar';
let selectedToneIndex = 0;
let selectedCategoryIndex = 0;
let selectedImageType = 'ad';

function pickImageType(type){
  selectedImageType = type;
  document.getElementById('imgTypeAd').classList.toggle('active', type==='ad');
  document.getElementById('imgTypeLogo').classList.toggle('active', type==='logo');

async function saveLang(lang){
  try{ if(window.storage){ await window.storage.set('wassaf_lang', lang, false); return; } }catch(e){}
  try{ localStorage.setItem('wassaf_lang', lang); }catch(e){}
}
async function loadLang(){
  try{
    if(window.storage){
      const r = await window.storage.get('wassaf_lang', false);
      if(r && r.value) return r.value;
    }
  }catch(e){}
  try{ const v = localStorage.getItem('wassaf_lang'); if(v) return v; }catch(e){}
  return 'ar';
}

function setLanguage(lang){
  currentLang = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById('langSwitch').value = lang;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.dataset.i18nPh;
    if(t[key] !== undefined) el.placeholder = t[key];
  });

  const catSel = document.getElementById('pCategory');
  catSel.innerHTML = t.categories.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
  catSel.value = selectedCategoryIndex;

  const toneGrid = document.getElementById('toneGrid');
  toneGrid.innerHTML = t.tones.map((tone,i)=>`<button type="button" class="tone-opt${i===selectedToneIndex?' active':''}" data-idx="${i}" onclick="pickTone(${i})">${tone}</button>`).join('');

  saveLang(lang);
}
function pickTone(idx){
  selectedToneIndex = idx;
  document.querySelectorAll('#toneGrid .tone-opt').forEach((b,i)=>b.classList.toggle('active', i===idx));
}

function setLoading(loading){
  const btn = document.getElementById('genBtn');
  const t = translations[currentLang];
  btn.disabled = loading;
  btn.querySelector('.btn-label').innerHTML = loading ? `<span class="spinner"></span> ${t.btnGenerating}` : t.btnGenerate;
}
function showErr(msg){ const el = document.getElementById('genErr'); el.textContent = msg; el.style.display='block'; }
function hideErr(){ document.getElementById('genErr').style.display='none'; }
function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseSections(text){
  const grab = (tag) => {
    const re = new RegExp('\\['+tag+'\\]([\\s\\S]*?)(?=\\n?\\[[A-Z]+\\]|$)');
    const m = text.match(re);
    return m ? m[1].trim() : '';
  };
  const bulletsRaw = grab('BULLETS');
  const keywordsRaw = grab('KEYWORDS');
  return {
    seoDescription: grab('SEO'),
    keywords: keywordsRaw.split(/[،,\n]/).map(s=>s.replace(/^[-•]\s*/,'').trim()).filter(Boolean),
    bulletPoints: bulletsRaw.split('\n').map(l=>l.replace(/^[-•*]\s*/,'').trim()).filter(Boolean),
    fbAd: grab('FB'),
    tiktokAd: grab('TIKTOK'),
    imagePrompt: grab('IMAGE_PROMPT')
  };
}

let lastImagePrompt = '';

async function callClaude(system, user){
  const response = await fetch('/api/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system, user })
  });
  const data = await response.json();
  if(!response.ok){ throw new Error((data && data.error && data.error.message) || 'request failed'); }
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}

function copyOut(elId, btnId){
  const text = document.getElementById(elId).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById(btnId);
    const orig = btn.textContent;
    btn.textContent = translations[currentLang].btnCopied; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}

async function generateContent(){
  const t = translations[currentLang];
  const name = document.getElementById('pName').value.trim();
  const features = document.getElementById('pFeatures').value.trim();
  const audience = document.getElementById('pAudience').value.trim();
  const categoryText = t.categories[document.getElementById('pCategory').value];
  const toneText = t.tones[selectedToneIndex];

  hideErr();

  setLoading(true);
  document.getElementById('results').classList.remove('show');
  try{
    const system = `You are an expert marketing copywriter specialized in e-commerce product content, writing entirely in ${t.langName}. Follow AIDA principles (Attention, Interest, Desire, Action) for ad copy.

Respond using EXACTLY this format, with no extra commentary before or after, and no Markdown symbols like asterisks:

[SEO]
(a 3-4 sentence SEO-friendly product description with natural keywords)
[KEYWORDS]
(5-8 short keywords separated by commas)
[BULLETS]
- selling point 1
- selling point 2
- selling point 3
- selling point 4
- selling point 5
[FB]
(a short-to-medium Facebook/Instagram ad paragraph following AIDA, ending with a clear call to action)
[TIKTOK]
(a very short, fast-paced TikTok ad script, max 3-4 short sentences)
[IMAGE_PROMPT]
(a concise, purely visual, physical description of the product itself in English ONLY, 1-2 sentences, mentioning size, type, shape, color, and material whenever that information is known from the input. Do not mention the brand name or any text. Always write this section in English regardless of the requested content language. Example: "a 43 inch flat screen smart TV with thin black bezels, mounted on a stand")

IMPORTANT: Keep the section markers [SEO] [KEYWORDS] [BULLETS] [FB] [TIKTOK] [IMAGE_PROMPT] exactly as shown, in English. Write the content inside [SEO] [KEYWORDS] [BULLETS] [FB] [TIKTOK] entirely in ${t.langName}. Write the content inside [IMAGE_PROMPT] entirely in English, no matter what ${t.langName} is.`;

    const user = `Product name: ${name}\nCategory: ${categoryText}\nKey features: ${features}\nTarget audience: ${audience || 'general'}\nTone of voice: ${toneText}`;

    const raw = await callClaude(system, user);
    const data = parseSections(raw);

    document.getElementById('seoOut').textContent = data.seoDescription || '';
    document.getElementById('kwWrap').innerHTML = (data.keywords||[]).map(k=>`<span class="kw">${escapeHtml(k)}</span>`).join('');
    document.getElementById('bulletsOut').innerHTML = (data.bulletPoints||[]).map(b=>`<li>${escapeHtml(b)}</li>`).join('');
    document.getElementById('bulletsPlainHidden').textContent = (data.bulletPoints||[]).map(b=>'• '+b).join('\n');

function compositeLogoText(imageUrl, text){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      const bandHeight = Math.round(img.height * 0.22);
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height + bandHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      ctx.fillStyle = '#141414';
      let fontSize = Math.round(bandHeight * 0.42);
      ctx.font = `700 ${fontSize}px Cairo, Tajawal, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      while(ctx.measureText(text).width > canvas.width * 0.9 && fontSize > 10){
        fontSize -= 2;
        ctx.font = `700 ${fontSize}px Cairo, Tajawal, sans-serif`;
      }
      ctx.fillText(text, canvas.width/2, img.height + bandHeight/2);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = imageUrl;
  });
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function generateImage(){
  const name = document.getElementById('pName').value.trim();
  const features = document.getElementById('pFeatures').value.trim();
  const categoryText = translations[currentLang].categories[document.getElementById('pCategory').value] || '';

  const btn = document.getElementById('imgBtn');
  const loadingEl = document.getElementById('imgLoading');
  const img = document.getElementById('adImage');
  const fileInput = document.getElementById('productPhoto');
  const file = fileInput && fileInput.files && fileInput.files[0];

  btn.disabled = true;
  img.style.display = 'none';
  loadingEl.style.display = 'block';
  loadingEl.textContent = translations[currentLang].imgLoadingText;

  if(file){
    try{
      const base64 = await resizeImageFile(file, 1024);
      const editPrompt = selectedImageType === 'logo'
        ? `redesign this into a flat 2D vector icon logo mark, app icon style, NOT a photograph, NOT realistic, simple geometric silhouette inspired by this product's shape, minimalist line art, bold vibrant colors, 2-3 colors maximum, isolated on plain solid background, flat illustration, graphic design asset, no photography, no 3d render, no scene, no shadows, no text, no words, no letters, no writing`
        : `turn this into a professional product advertisement photo, studio lighting, clean elegant background, high quality marketing photography, keep the product itself unchanged and realistic`;

      const response = await fetch('/api/generate-image-edit', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ image: base64, prompt: editPrompt })
      });

      if(!response.ok){
        const errData = await response.json().catch(()=>({}));
        throw new Error(errData.error || 'edit failed');
      }

      const blob = await response.blob();
      let finalUrl = URL.createObjectURL(blob);
      if(selectedImageType === 'logo' && name){
        try{ finalUrl = await compositeLogoText(finalUrl, name); }catch(e){}
      }
      img.src = finalUrl;
      img.style.display = 'block';
      loadingEl.style.display = 'none';
      btn.disabled = false;
    }catch(e){
      loadingEl.textContent = translations[currentLang].imgErrText;
      btn.disabled = false;
    }
    return;
  }

  const prompt = selectedImageType === 'logo'
    ? `flat 2D vector icon logo mark, app icon style, NOT a photograph, NOT realistic, simple geometric shape, single bold silhouette icon representing a ${categoriesEn[document.getElementById('pCategory').value]} brand, minimalist line art, 2 colors maximum, isolated on plain solid white background, flat illustration, graphic design asset, no photography, no 3d render, no scene, no room, no shadows, no text, no words, no letters, no writing`
    : `professional studio product photography, ${lastImagePrompt ? lastImagePrompt : `a single ${categoriesEn[document.getElementById('pCategory').value]} item`}, centered and filling most of the frame, isolated product shot on a table${isMostlyLatin(features) && features ? ', ' + features : ''}, elegant studio lighting, clean minimal background, high quality commercial marketing photography, no text, no words, no writing, no letters, no room, no empty scene`;

  const url = `/api/generate-image?prompt=${encodeURIComponent(prompt)}`;

  let doneAlready = false;
  const timeoutId = setTimeout(()=>{
    if(!doneAlready){
      doneAlready = true;
      loadingEl.textContent = translations[currentLang].imgTimeoutText;
      btn.disabled = false;
    }
  }, 55000);

  img.referrerPolicy = 'no-referrer';
  img.onload = async function(){
    if(doneAlready) return;
    doneAlready = true;
    clearTimeout(timeoutId);
    if(selectedImageType === 'logo' && name){
      try{
        const composited = await compositeLogoText(img.src, name);
        img.src = composited;
      }catch(e){}
    }
    img.style.display = 'block';
    loadingEl.style.display = 'none';
    btn.disabled = false;
  };
  img.onerror = function(){
    if(doneAlready) return;
    doneAlready = true;
    clearTimeout(timeoutId);
    loadingEl.textContent = translations[currentLang].imgErrText;
    btn.disabled = false;
  };
  img.src = url;
}

const langCodeMap = { ar:'ar-SA', en:'en-US', fr:'fr-FR', es:'es-ES' };
function speakText(text){
  if(!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langCodeMap[currentLang] || 'ar-SA';
  window.speechSynthesis.speak(utter);
}

async function analyzeFromPhoto(){
  const fileInput = document.getElementById('photoOnlyInput');
  const file = fileInput && fileInput.files && fileInput.files[0];
  const errEl = document.getElementById('analyzeErr');
  const btn = document.getElementById('analyzeBtn');
  const btnLabel = document.getElementById('analyzeBtnLabel');
  const t = translations[currentLang];
  errEl.style.display = 'none';

  if(!file){
    errEl.textContent = t.analyzeErrNoFile;
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btnLabel.innerHTML = `<span class="spinner"></span> ${t.btnAnalyzing}`;
  document.getElementById('photoResults').classList.remove('show');

  const imgOut = document.getElementById('photoAdImage');
  const imgLoading = document.getElementById('photoImgLoading');
  imgOut.style.display = 'none';
  imgLoading.style.display = 'block';
  imgLoading.textContent = t.imgLoadingText;

  try{
    const base64 = await resizeImageFile(file, 1024);
    const langName = t.langName;

    const textRes = await fetch('/api/analyze-image', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: base64, langName })
    });
    const textData = await textRes.json();
    if(!textRes.ok){ throw new Error((textData.error && textData.error.message) || 'analyze failed'); }
    const raw = (textData.content||[]).map(b=>b.text||'').join('\n').trim();
    const data = parseSections(raw);

    document.getElementById('photoSeoOut').textContent = data.seoDescription || '';
    document.getElementById('photoKwWrap').innerHTML = (data.keywords||[]).map(k=>`<span class="kw">${escapeHtml(k)}</span>`).join('');
    document.getElementById('photoBulletsOut').innerHTML = (data.bulletPoints||[]).map(b=>`<li>${escapeHtml(b)}</li>`).join('');
    document.getElementById('photoBulletsPlainHidden').textContent = (data.bulletPoints||[]).map(b=>'• '+b).join('\n');
    document.getElementById('photoFbOut').textContent = data.fbAd || '';
    document.getElementById('photoTiktokOut').textContent = data.tiktokAd || '';
    document.getElementById('photoResults').classList.add('show');
    document.getElementById('photoResults').scrollIntoView({behavior:'smooth', block:'start'});

    const editRes = await fetch('/api/generate-image-edit', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: base64, prompt: 'turn this into a professional product advertisement photo, studio lighting, clean elegant background, high quality marketing photography, keep the product itself unchanged and realistic' })
    });
    if(!editRes.ok){
      imgLoading.textContent = t.imgErrText;
    } else {
      const blob = await editRes.blob();
      imgOut.src = URL.createObjectURL(blob);
      imgOut.style.display = 'block';
      imgLoading.style.display = 'none';
    }

  }catch(e){
    errEl.textContent = t.errPrefix + (e.message || '?') + t.errSuffix;
    errEl.style.display = 'block';
    imgLoading.style.display = 'none';
  }finally{
    btn.disabled = false;
    btnLabel.textContent = t.btnAnalyze;
  }
}
