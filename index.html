<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0E2024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wassaf">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<title>وصّاف · Wassaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12082B;
  --card:#1E1240;
  --ink:#FFFFFF; --ink-dim:rgba(255,255,255,0.68);
  --accent:#FF3D81; --accent-soft:#FF7BAA;
  --gold:#FFC857;
  --success:#4ADE80; --danger:#FF8A9B;
  --font-d:'Cairo',sans-serif; --font-b:'Tajawal',sans-serif; --font-lat:'Poppins',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;color:var(--ink);font-family:var(--font-b);min-height:100%;}
body{
  position:relative;
  overflow-x:hidden;
  background:linear-gradient(150deg,#FF3D81 0%,#7C3AED 45%,#2563EB 100%);
  background-attachment:fixed;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;
}
body::before{width:280px;height:280px;background:rgba(255,200,87,0.55);top:-60px;inset-inline-end:-60px;}
body::after{width:340px;height:340px;background:rgba(37,99,235,0.55);bottom:-100px;inset-inline-start:-80px;}
html[lang="en"] body,html[lang="fr"] body,html[lang="es"] body{font-family:var(--font-lat);}
h1,h2,h3{font-family:var(--font-d);}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,
html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3,
html[lang="es"] h1,html[lang="es"] h2,html[lang="es"] h3{font-family:var(--font-lat);font-weight:800;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

.topbar{padding:16px 18px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,0.35);}
.brand{display:flex;align-items:center;gap:10px;}
.logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(155deg,var(--accent-soft),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 8px 20px rgba(255,61,129,0.55);}
.brand-name{font-weight:800;font-size:18px;}
.langbox select{
  background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);color:var(--ink);
  border-radius:11px;padding:7px 10px;font-size:12.5px;font-weight:700;
}

.hero{padding:36px 20px 28px;text-align:center;position:relative;z-index:1;}
.hero h1{margin:0 0 8px;font-size:27px;font-weight:800;line-height:1.35;}
.hero h1 span{color:var(--gold);}
.hero p{margin:0 auto;max-width:420px;font-size:14px;color:rgba(255,255,255,0.85);line-height:1.7;}
.feature-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.feature-chip{background:rgba(255,255,255,0.16);border:2px solid rgba(255,255,255,0.25);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;}

.wrap{max-width:600px;margin:0 auto;padding:0 16px 50px;position:relative;z-index:1;}
.card{background:var(--card);border-inline-start:5px solid var(--accent);border-radius:24px;padding:20px;margin-top:-6px;margin-bottom:18px;position:relative;box-shadow:0 24px 50px rgba(0,0,0,0.4);}
.section-title{font-size:14px;color:var(--gold);font-weight:800;margin:2px 0 14px;display:flex;align-items:center;gap:6px;}
label{display:block;font-size:12px;color:var(--ink-dim);margin:13px 0 7px;font-weight:700;}
input[type=text],select,textarea{
  width:100%;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.14);color:var(--ink);
  border-radius:13px;padding:11px 13px;font-size:14px;
}
select option{background:#1E1240;color:#fff;}
textarea{min-height:80px;resize:vertical;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}

.tonegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px;}
.tone-opt{padding:11px;border-radius:13px;border:2px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:var(--ink-dim);font-weight:700;font-size:12.5px;text-align:center;transition:all .15s;}
.tone-opt.active{border-color:var(--accent);background:linear-gradient(155deg,var(--accent-soft),var(--accent));color:#fff;box-shadow:0 8px 20px rgba(255,61,129,0.4);}

.btn{border:none;border-radius:15px;padding:14px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-accent{background:linear-gradient(120deg,var(--gold),var(--accent) 60%,#7C3AED);color:#fff;box-shadow:0 16px 34px rgba(255,61,129,0.5);}
.btn-block{width:100%;}
.btn:disabled{opacity:.55;pointer-events:none;}
.btn-outline{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);color:var(--ink);padding:8px 13px;font-size:12.5px;font-weight:700;border-radius:11px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.err{background:rgba(255,61,129,0.16);border:2px solid rgba(255,61,129,0.4);color:#FFD3E1;padding:10px 12px;border-radius:12px;font-size:12.5px;margin-top:12px;}

.results{display:none;margin-top:6px;}
.results.show{display:block;}
.out-card{background:var(--card);border-inline-start:5px solid var(--gold);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 18px 40px rgba(0,0,0,0.35);}
.out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.out-head h3{margin:0;font-size:13.5px;color:var(--gold);}
.out-body{font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:var(--ink);}
.kw-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.kw{background:rgba(255,200,87,0.2);color:var(--gold);border:2px solid rgba(255,200,87,0.4);padding:4px 10px;border-radius:14px;font-size:11.5px;font-weight:700;}
.bullets{margin:0;padding-inline-start:18px;}
.bullets li{margin-bottom:6px;line-height:1.7;}
.copied{color:var(--success)!important;}
.hint{font-size:11.5px;color:var(--ink-dim);margin-top:6px;line-height:1.7;text-align:center;}
.ad-image{width:100%;border-radius:18px;display:block;margin-top:12px;box-shadow:0 16px 36px rgba(0,0,0,0.4);}
.img-loading{font-size:12.5px;color:var(--ink-dim);text-align:center;margin-top:10px;}

.auth-btn{background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);color:var(--ink);border-radius:11px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:22px;padding:22px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.5);position:relative;}
.modal-close{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,0.1);border:none;color:var(--ink);width:28px;height:28px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-title{font-size:16px;font-weight:800;color:var(--gold);margin:0 0 14px;}
.auth-msg{font-size:12.5px;margin-top:10px;line-height:1.7;display:none;}
.auth-msg.show{display:block;}
.auth-msg.ok{color:var(--success);}
.auth-msg.bad{color:#FFD3E1;}

.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:110;}
.drawer-overlay.show{display:block;}
.settings-drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(320px,86vw);background:var(--card);box-shadow:-14px 0 40px rgba(0,0,0,0.4);z-index:111;padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;}
html[dir="rtl"] .settings-drawer{transform:translateX(-100%);}
.settings-drawer.show{transform:translateX(0) !important;}

.tour-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:120;align-items:center;justify-content:center;padding:16px;}
.tour-overlay.show{display:flex;}
.tour-box{background:var(--card);border-radius:22px;padding:24px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.5);text-align:center;}
.tour-icon{font-size:38px;margin-bottom:10px;}
.tour-title{font-size:16px;font-weight:800;color:var(--gold);margin:0 0 10px;}
.tour-body{color:var(--ink-dim);font-size:13px;line-height:1.8;margin:0 0 18px;}
.tour-dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
.tour-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.25);}
.tour-dot.active{background:var(--gold);}

.kit-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.kit-tabs .tone-opt{flex:none;padding:9px 13px;}
#wassafPrintArea{display:none;}
@media print{
  @page{ size: portrait; margin: 16mm 14mm; }
  body.printing-mode > *:not(#wassafPrintArea){display:none !important;}
  body.printing-mode{background:#fff !important;}
  body.printing-mode::before, body.printing-mode::after{display:none !important;content:none !important;}
  #wassafPrintArea{
    display:block !important;
    background:#fff; color:#111;
    font-family:'Tajawal','Cairo',Arial,sans-serif;
    font-size:16px; line-height:2; padding:10px 4px;
  }
  #wassafPrintArea .wpp-header h1{font-size:26px;font-weight:800;margin:0 0 22px;color:#111;}
  #wassafPrintArea .wpp-section{margin-bottom:26px;page-break-inside:avoid;}
  #wassafPrintArea .wpp-section h2{font-size:19px;font-weight:800;margin:0 0 10px;color:#111;border-bottom:2px solid #333;padding-bottom:6px;}
  #wassafPrintArea .wpp-section p{margin:0;white-space:pre-wrap;}
  #wassafPrintArea .wpp-section ul{margin:0;padding-inline-start:22px;}
  #wassafPrintArea .wpp-section li{margin-bottom:8px;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo" style="background:none;box-shadow:none;padding:0;overflow:hidden;"><img src="/logo.png" alt="وصّاف" style="width:100%;height:100%;object-fit:cover;"></div>
    <div class="brand-name">وصّاف</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button type="button" class="auth-btn" id="settingsBtn" onclick="openSettingsDrawer()" title="Settings" style="padding:8px 11px;font-size:15px;">⚙️</button>
    <button type="button" class="auth-btn" id="authBtn" data-i18n="authBtnLogin" onclick="onAuthBtnClick()">تسجيل دخول</button>
    <div class="langbox">
      <select id="langSwitch" onchange="setLanguage(this.value)">
        <option value="ar">🇪🇬 العربية</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="settingsOverlay" onclick="closeSettingsDrawer()"></div>
<div class="settings-drawer" id="settingsDrawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
    <div class="modal-title" style="margin:0;" data-i18n="settingsTitle">الإعدادات</div>
    <button class="modal-close" style="position:static;" onclick="closeSettingsDrawer()">✕</button>
  </div>

  <div class="section-title" data-i18n="settingsAboutTitle">عن وصّاف</div>
  <p style="color:var(--ink-dim);font-size:12.5px;line-height:1.9;margin:0 0 18px;" data-i18n="settingsAboutBody"></p>

  <div class="section-title" data-i18n="settingsQuickLinks">وصول سريع</div>
  <button type="button" class="btn-outline btn-block" style="margin-bottom:8px;" onclick="closeSettingsDrawer();switchPage('form');toggleHistory();">📚 <span data-i18n="btnHistory"></span></button>
  <button type="button" class="btn-outline btn-block" style="margin-bottom:8px;" onclick="closeSettingsDrawer();switchPage('form');toggleBrandKits();">🎨 <span data-i18n="btnBrandKits"></span></button>
  <button type="button" class="btn-outline btn-block" style="margin-bottom:18px;" onclick="closeSettingsDrawer();switchPage('pricing');">💳 <span data-i18n="tabPricing"></span></button>

  <div class="section-title" data-i18n="settingsHelpTitle">مساعدة</div>
  <button type="button" class="btn-outline btn-block" onclick="closeSettingsDrawer();replayTour();">🧭 <span data-i18n="btnReplayTour"></span></button>
</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAuthModal()">✕</button>
    <div class="modal-title" data-i18n="authModalTitle">تسجيل الدخول</div>
    <label data-i18n="authEmailLabel">الإيميل</label>
    <input type="text" id="authEmail" placeholder="example@email.com">
    <label data-i18n="authPasswordLabel">كلمة السر</label>
    <input type="text" id="authPassword" placeholder="على الأقل 6 حروف/أرقام">
    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="handleSignIn()" id="signInBtn" data-i18n="authSignIn">دخول</button>
    <button class="btn-outline btn-block" style="margin-top:10px;" onclick="handleSignUp()" id="signUpBtn" data-i18n="authSignUp">حساب جديد</button>
    <div style="text-align:center;margin-top:12px;">
      <button type="button" onclick="openForgotModal()" style="background:none;border:none;color:var(--gold);font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;" data-i18n="authForgotLink">نسيت كلمة السر؟</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="forgotModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeForgotModal()">✕</button>
    <div class="modal-title" data-i18n="forgotModalTitle">استرجاع كلمة السر</div>
    <p style="color:var(--ink-dim);font-size:12.5px;line-height:1.8;margin:0 0 14px;" data-i18n="forgotModalDesc"></p>
    <label data-i18n="authEmailLabel">الإيميل</label>
    <input type="text" id="forgotEmail" placeholder="example@email.com">
    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="handleForgotPassword()" id="forgotSendBtn" data-i18n="btnSendResetLink">ابعتي لينك الاسترجاع</button>
    <div class="auth-msg" id="forgotMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="resetPasswordModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="resetModalTitle">كلمة سر جديدة</div>
    <p style="color:var(--ink-dim);font-size:12.5px;line-height:1.8;margin:0 0 14px;" data-i18n="resetModalDesc"></p>
    <label data-i18n="authPasswordLabel">كلمة السر</label>
    <input type="text" id="newPassword" placeholder="على الأقل 6 حروف/أرقام">
    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="handleSetNewPassword()" id="resetPasswordBtn" data-i18n="btnSetNewPassword">حفظ كلمة السر الجديدة</button>
    <div class="auth-msg" id="resetMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="accountModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAccountModal()">✕</button>
    <div class="modal-title" data-i18n="accountModalTitle">حسابك</div>
    <div style="font-size:13.5px;color:var(--ink-dim);margin-bottom:16px;" id="accountEmailLabel"></div>
    <button class="btn btn-accent btn-block" onclick="handleSignOut()" data-i18n="accountSignOut">تسجيل خروج</button>
  </div>
</div>

<div class="hero">
  <h1 data-i18n="heroTitle"></h1>
  <p data-i18n="heroSubtitle"></p>
  <div class="feature-row">
    <div class="feature-chip">🔍 <span data-i18n="feature1"></span></div>
    <div class="feature-chip">🌍 <span data-i18n="feature2"></span></div>
    <div class="feature-chip">⚡ <span data-i18n="feature3"></span></div>
  </div>
</div>

<div class="wrap" style="padding-bottom:0;">
  <div style="display:flex;gap:8px;margin-top:-8px;margin-bottom:14px;">
    <button type="button" class="tone-opt active" id="pageTabForm" onclick="switchPage('form')" style="flex:1;" data-i18n="tabForm"></button>
    <button type="button" class="tone-opt" id="pageTabPhoto" onclick="switchPage('photo')" style="flex:1;" data-i18n="tabPhoto"></button>
    <button type="button" class="tone-opt" id="pageTabPricing" onclick="switchPage('pricing')" style="flex:1;" data-i18n="tabPricing"></button>
  </div>
</div>

<div class="wrap" id="pageForm">
  <button type="button" class="btn-outline" style="margin-bottom:10px;" onclick="toggleHistory()">📚 <span data-i18n="btnHistory"></span></button>
  <div class="out-card" id="historyPanel" style="display:none;">
    <div class="out-head"><h3 data-i18n="historyTitle"></h3><button class="btn-outline" onclick="clearHistory()" data-i18n="btnClearHistory"></button></div>
    <div id="historyList"></div>
  </div>

  <button type="button" class="btn-outline" style="margin-bottom:10px;margin-inline-start:8px;" onclick="toggleBrandKits()">🎨 <span data-i18n="btnBrandKits"></span></button>
  <div class="out-card" id="brandKitPanel" style="display:none;">
    <div class="out-head"><h3 data-i18n="brandKitTitle"></h3><button class="btn-outline" onclick="saveCurrentAsBrandKit()" data-i18n="btnSaveBrandKit"></button></div>
    <div id="brandKitList"></div>
  </div>

  <div class="card">
    <div class="section-title">📦 <span data-i18n="sectionProduct"></span></div>

    <label data-i18n="labelName"></label>
    <input type="text" id="pName" data-i18n-ph="placeholderName">

    <label data-i18n="labelCategory"></label>
    <select id="pCategory"></select>

    <label data-i18n="labelFeatures"></label>
    <textarea id="pFeatures" data-i18n-ph="placeholderFeatures"></textarea>

    <label data-i18n="labelAudience"></label>
    <input type="text" id="pAudience" data-i18n-ph="placeholderAudience">

    <label data-i18n="labelTone"></label>
    <div class="tonegrid" id="toneGrid"></div>

    <label data-i18n="labelGoal"></label>
    <select id="pGoal"></select>

    <button class="btn btn-accent btn-block" style="margin-top:16px;" onclick="generateContent()" id="genBtn">
      <span class="btn-label" data-i18n="btnGenerate"></span>
    </button>
    <div class="err" id="genErr" style="display:none;"></div>

    <button type="button" class="btn-outline btn-block" style="margin-top:14px;" onclick="toggleCompare()">⚖️ <span data-i18n="btnCompareToggle"></span></button>
    <div id="comparePanel" style="display:none;margin-top:10px;">
      <div class="row">
        <div>
          <label data-i18n="compareToneA"></label>
          <select id="compareToneASel"></select>
        </div>
        <div>
          <label data-i18n="compareToneB"></label>
          <select id="compareToneBSel"></select>
        </div>
      </div>
      <button class="btn btn-accent btn-block" style="margin-top:12px;" onclick="runCompare()" id="compareBtn"><span data-i18n="btnRunCompare"></span></button>
      <div id="compareResults" style="display:none;margin-top:12px;"></div>
    </div>
  </div>

  <div class="out-card">
    <div class="out-head"><h3 data-i18n="imgCardTitle"></h3></div>
    <div class="tonegrid" style="margin-bottom:10px;">
      <button type="button" class="tone-opt active" id="imgTypeAd" onclick="pickImageType('ad')" data-i18n="imgTypeAd"></button>
      <button type="button" class="tone-opt" id="imgTypeLogo" onclick="pickImageType('logo')" data-i18n="imgTypeLogo"></button>
    </div>
    <label data-i18n="imgUploadLabel" style="color:var(--gold);"></label>
    <input type="file" accept="image/*" id="productPhoto" style="display:none;" onchange="updateFileLabel(this,'productPhotoName')">
    <button type="button" class="btn-outline btn-block" style="margin-bottom:6px;" onclick="document.getElementById('productPhoto').click()" data-i18n="btnChooseFile"></button>
    <div class="hint" id="productPhotoName" style="margin-bottom:10px;"></div>
    <button class="btn btn-accent btn-block" onclick="generateImage()" id="imgBtn"><span data-i18n="btnGenImage"></span></button>
    <div class="img-loading" id="imgLoading" style="display:none;"></div>
    <img class="ad-image" id="adImage" style="display:none;">
  </div>

  <div class="results" id="results">

let currentUser = null;

function openAuthModal(){
  document.getElementById('authMsg').classList.remove('show');
  document.getElementById('authModal').classList.add('show');
}
function closeAuthModal(){ document.getElementById('authModal').classList.remove('show'); }
function openAccountModal(){
  document.getElementById('accountEmailLabel').textContent = currentUser ? currentUser.email : '';
  document.getElementById('accountModal').classList.add('show');
}
function closeAccountModal(){ document.getElementById('accountModal').classList.remove('show'); }
function openForgotModal(){
  closeAuthModal();
  document.getElementById('forgotMsg').classList.remove('show');
  document.getElementById('forgotModal').classList.add('show');
}
function closeForgotModal(){ document.getElementById('forgotModal').classList.remove('show'); }
function closeResetPasswordModal(){ document.getElementById('resetPasswordModal').classList.remove('show'); }

function onAuthBtnClick(){
  if(currentUser){ openAccountModal(); } else { openAuthModal(); }
}

function showAuthMsg(text, ok){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.classList.remove('ok','bad');
  el.classList.add('show', ok ? 'ok' : 'bad');
}
function showForgotMsg(text, ok){
  const el = document.getElementById('forgotMsg');
  el.textContent = text;
  el.classList.remove('ok','bad');
  el.classList.add('show', ok ? 'ok' : 'bad');
}
function showResetMsg(text, ok){
  const el = document.getElementById('resetMsg');
  el.textContent = text;
  el.classList.remove('ok','bad');
  el.classList.add('show', ok ? 'ok' : 'bad');
}

function updateAuthButton(){
  const btn = document.getElementById('authBtn');
  if(currentUser){
    btn.textContent = currentUser.email;
  } else {
    btn.textContent = translations[currentLang].authBtnLogin;
  }
}

async function handleSignUp(){
  const t = translations[currentLang];
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ showAuthMsg(t.authMsgMissing, false); return; }
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ showAuthMsg(t.errPrefix + error.message, false); return; }
  showAuthMsg(t.authMsgSignedUp, true);
}

async function handleSignIn(){
  const t = translations[currentLang];
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ showAuthMsg(t.authMsgMissing, false); return; }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ showAuthMsg(t.errPrefix + error.message, false); return; }
  currentUser = data.user;
  updateAuthButton();
  closeAuthModal();
}

async function handleForgotPassword(){
  const t = translations[currentLang];
  const email = document.getElementById('forgotEmail').value.trim();
  if(!email){ showForgotMsg(t.authMsgMissing, false); return; }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){ showForgotMsg(t.errPrefix + error.message, false); return; }
  showForgotMsg(t.forgotSentMsg, true);
}

async function handleSetNewPassword(){
  const t = translations[currentLang];
  const password = document.getElementById('newPassword').value;
  if(!password){ showResetMsg(t.authMsgMissing, false); return; }
  const { error } = await supabaseClient.auth.updateUser({ password });
  if(error){ showResetMsg(t.errPrefix + error.message, false); return; }
  showResetMsg(t.resetSuccessMsg, true);
  setTimeout(()=>{ closeResetPasswordModal(); }, 1800);
}

async function handleSignOut(){
  await supabaseClient.auth.signOut();
  currentUser = null;
  updateAuthButton();
  closeAccountModal();
}

async function initAuth(){
  const { data } = await supabaseClient.auth.getSession();
  if(data && data.session){
    currentUser = data.session.user;
    updateAuthButton();
  }
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    currentUser = session ? session.user : null;
    updateAuthButton();
    if(event === 'PASSWORD_RECOVERY'){
      document.getElementById('resetPasswordModal').classList.add('show');
    }
  });
}
initAuth();

function isMostlyLatin(str){
  if(!str) return false;
  const nonLatin = (str.match(/[^\x00-\x7F]/g)||[]).length;
  return nonLatin < str.length * 0.3;
}

let selectedCategoryIndex = 0;
let selectedImageType = 'ad';

function updateFileLabel(inputEl, labelId){
  const label = document.getElementById(labelId);
  const t = translations[currentLang];
  label.textContent = (inputEl.files && inputEl.files[0]) ? inputEl.files[0].name : t.noFileChosen;

async function saveLang(lang){
  try{ if(window.storage){ await window.storage.set('wassaf_lang', lang, false); return; } }catch(e){}
  try{ localStorage.setItem('wassaf_lang', lang); }catch(e){}
}
async function loadLang(){
  try{
    if(window.storage){
      const r = await window.storage.get('wassaf_lang', false);
      if(r && r.value) return r.value;
    }
  }catch(e){}
  try{ const v = localStorage.getItem('wassaf_lang'); if(v) return v; }catch(e){}
  return 'ar';
}

function setLanguage(lang){
  currentLang = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById('langSwitch').value = lang;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.dataset.i18nPh;
    if(t[key] !== undefined) el.placeholder = t[key];
  });

  const catSel = document.getElementById('pCategory');
  catSel.innerHTML = t.categories.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
  catSel.value = selectedCategoryIndex;

  const goalSel = document.getElementById('pGoal');
  const prevGoal = goalSel.value || '0';
  goalSel.innerHTML = t.goals.map((g,i)=>`<option value="${i}">${g}</option>`).join('');
  goalSel.value = prevGoal;

  if(selectedToneIndex >= t.tones.length) selectedToneIndex = 0;
  const toneGrid = document.getElementById('toneGrid');
  toneGrid.innerHTML = t.tones.map((tone,i)=>`<button type="button" class="tone-opt${i===selectedToneIndex?' active':''}" data-idx="${i}" onclick="pickTone(${i})">${tone}</button>`).join('');

  const cmpA = document.getElementById('compareToneASel');
  const cmpB = document.getElementById('compareToneBSel');
  if(cmpA && cmpB){
    cmpA.innerHTML = t.tones.map((tone,i)=>`<option value="${i}">${tone}</option>`).join('');
    cmpB.innerHTML = t.tones.map((tone,i)=>`<option value="${i}">${tone}</option>`).join('');
    cmpA.value = 0; cmpB.value = t.tones.length > 1 ? 1 : 0;
  }

  saveLang(lang);
  updateAuthButton();
  updateFileLabel(document.getElementById('productPhoto'), 'productPhotoName');
  updateFileLabel(document.getElementById('photoOnlyInput'), 'photoOnlyInputName');
  if(currentKit) renderKit();
}
function pickTone(idx){
  selectedToneIndex = idx;
  document.querySelectorAll('#toneGrid .tone-opt').forEach((b,i)=>b.classList.toggle('active', i===idx));
}

function setLoading(loading){
  const btn = document.getElementById('genBtn');
  const t = translations[currentLang];
  btn.disabled = loading;
  btn.querySelector('.btn-label').innerHTML = loading ? `<span class="spinner"></span> ${t.btnGenerating}` : t.btnGenerate;
}
function showErr(msg){ const el = document.getElementById('genErr'); el.textContent = msg; el.style.display='block'; }
function hideErr(){ document.getElementById('genErr').style.display='none'; }
function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseSections(text){
  const grab = (tag) => {
    const re = new RegExp('\\['+tag+'\\]([\\s\\S]*?)(?=\\n?\\[[A-Z_]+\\]|$)');
    const m = text.match(re);
    return m ? m[1].trim() : '';
  };
  const bulletsRaw = grab('BULLETS');
  const keywordsRaw = grab('KEYWORDS');
  return {
    seoDescription: grab('SEO'),
    keywords: keywordsRaw.split(/[،,\n]/).map(s=>s.replace(/^[-•]\s*/,'').trim()).filter(Boolean),
    bulletPoints: bulletsRaw.split('\n').map(l=>l.replace(/^[-•*]\s*/,'').trim()).filter(Boolean),
    fbAd: grab('FB'),
    tiktokAd: grab('TIKTOK'),
    imagePrompt: grab('IMAGE_PROMPT')
  };
}

let lastImagePrompt = '';

async function callClaude(system, user, json){
  const response = await fetch('/api/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system, user, json: !!json })
  });
  const data = await response.json();
  if(!response.ok){ throw new Error((data && data.error && data.error.message) || 'request failed'); }
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}

function copyOut(elId, btnId){
  const text = document.getElementById(elId).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById(btnId);
    const orig = btn.textContent;
    btn.textContent = translations[currentLang].btnCopied; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}

const FREE_TRY_LIMIT = 3;
async function getUsageCount(){
  if(!currentUser) return 0;
  const { count, error } = await supabaseClient
    .from('history')
    .select('id', { count: 'exact', head: true })
    .eq('user_id', currentUser.id);
  if(error){ console.error(error); return 0; }
  return count || 0;
}
async function checkUsageAndAuth(errShowFn){
  const t = translations[currentLang];
  if(!currentUser){
    openAuthModal();
    errShowFn(t.authRequiredMsg);
    return false;
  }
  const count = await getUsageCount();
  if(count >= FREE_TRY_LIMIT){
    errShowFn(t.usageLimitReached);
    return false;
  }
  return true;
}

async function generateContent(){
  const t = translations[currentLang];
  hideErr();
  const allowed = await checkUsageAndAuth(showErr);
  if(!allowed) return;

  const name = document.getElementById('pName').value.trim();
  const features = document.getElementById('pFeatures').value.trim();
  const audience = document.getElementById('pAudience').value.trim();
  const categoryText = t.categories[document.getElementById('pCategory').value];
  const toneText = t.tones[selectedToneIndex];

  if(!name || !features){ showErr(t.errMissing); return; }

  setLoading(true);
  document.getElementById('results').classList.remove('show');
  try{
    const isEgyptianDialect = currentLang === 'ar' && selectedToneIndex === 4;
    const langForPrompt = isEgyptianDialect

function compositeLogoText(imageUrl, text){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      const bandHeight = Math.round(img.height * 0.22);
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height + bandHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      ctx.fillStyle = '#141414';
      let fontSize = Math.round(bandHeight * 0.42);
      ctx.font = `700 ${fontSize}px Cairo, Tajawal, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      while(ctx.measureText(text).width > canvas.width * 0.9 && fontSize > 10){
        fontSize -= 2;
        ctx.font = `700 ${fontSize}px Cairo, Tajawal, sans-serif`;
      }
      ctx.fillText(text, canvas.width/2, img.height + bandHeight/2);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = imageUrl;
  });
}

let bgRemovalModulePromise = null;
function loadBgRemovalModule(){
  if(!bgRemovalModulePromise){
    bgRemovalModulePromise = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
  }
  return bgRemovalModulePromise;
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function removeBgFromFile(file){
  const mod = await loadBgRemovalModule();
  const removeBackground = mod.default || mod.removeBackground;
  const cutoutBlob = await removeBackground(file);
  return URL.createObjectURL(cutoutBlob);
}
async function makeStudioAdFromFile(file){
  const cutoutUrl = await removeBgFromFile(file);
  const cutoutImg = await loadImageEl(cutoutUrl);

  const W = 1024, H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createRadialGradient(W/2, H*0.35, 40, W/2, H/2, W*0.75);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#dde2ea');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min((W*0.7)/cutoutImg.width, (H*0.7)/cutoutImg.height);
  const dw = cutoutImg.width * scale;
  const dh = cutoutImg.height * scale;
  const dx = (W - dw) / 2;
  const dy = (H - dh) / 2 - H*0.03;

  ctx.save();
  ctx.filter = 'blur(20px)';
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(W/2, dy + dh + 6, dw*0.32, dh*0.07, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.filter = 'contrast(1.08) brightness(1.04) saturate(1.05)';
  ctx.drawImage(cutoutImg, dx, dy, dw, dh);
  ctx.filter = 'none';

  return canvas.toDataURL('image/png');
}
async function makeLogoBaseFromFile(file){
  const cutoutUrl = await removeBgFromFile(file);
  const cutoutImg = await loadImageEl(cutoutUrl);

  const W = 800, H = 800;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min((W*0.72)/cutoutImg.width, (H*0.72)/cutoutImg.height);
  const dw = cutoutImg.width * scale;
  const dh = cutoutImg.height * scale;
  ctx.drawImage(cutoutImg, (W-dw)/2, (H-dh)/2, dw, dh);

  return canvas.toDataURL('image/png');
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    try{
      let finalUrl = selectedImageType === 'logo'
        ? await makeLogoBaseFromFile(file)
        : await makeStudioAdFromFile(file);
      if(selectedImageType === 'logo' && name){
        try{ finalUrl = await compositeLogoText(finalUrl, name); }catch(e){}
      }

      img.style.display = 'block';

      btn.disabled = false;
    }catch(e){
      console.error(e);
      loadingEl.textContent = translations[currentLang].imgErrText;
      btn.disabled = false;
    }
    return;
  }

  loadingEl.textContent = translations[currentLang].imgLoadingText;

  const prompt = selectedImageType === 'logo'
    ? `flat 2D vector icon logo mark, app icon style, NOT a photograph, NOT realistic, simple geometric shape, single bold silhouette icon representing a ${categoriesEn[document.getElementById('pCategory').value]} brand, minimalist line art, 2 colors maximum, isolated on plain solid white background, flat illustration, graphic design asset, no photography, no 3d render, no scene, no room, no shadows, no text, no words, no letters, no writing`
    : `professional studio product photography, ${lastImagePrompt ? lastImagePrompt : `a single ${categoriesEn[document.getElementById('pCategory').value]} item`}, centered and filling most of the frame, isolated product shot on a table${isMostlyLatin(features) && features ? ', ' + features : ''}, elegant studio lighting, clean minimal background, high quality commercial marketing photography, no text, no words, no writing, no letters, no room, no empty scene`;

  const url = `/api/generate-image?prompt=${encodeURIComponent(prompt)}`;

  let doneAlready = false;
  const timeoutId = setTimeout(()=>{
    if(!doneAlready){
      doneAlready = true;
      loadingEl.textContent = translations[currentLang].imgTimeoutText;
      btn.disabled = false;
    }
  }, 55000);

  img.referrerPolicy = 'no-referrer';
  img.onload = async function(){
    if(doneAlready) return;
    doneAlready = true;
    clearTimeout(timeoutId);
    if(selectedImageType === 'logo' && name){
      try{
        const composited = await compositeLogoText(img.src, name);
        img.src = composited;
      }catch(e){}
    }
    img.style.display = 'block';
    loadingEl.style.display = 'none';
    btn.disabled = false;
  };
  img.onerror = function(){
    if(doneAlready) return;
    doneAlready = true;
    clearTimeout(timeoutId);
    loadingEl.textContent = translations[currentLang].imgErrText;
    btn.disabled = false;
  };
  img.src = url;
}

const goalsEn = ['Increase sales','Brand awareness','Get clicks','Launch a product','Build trust'];

function parseKitJson(raw){
  const s = String(raw || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try{ return JSON.parse(s); }catch(e){}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
  throw new Error('invalid response');
}
function normalizeKit(k){
  k = k || {};
  const S = v => (v == null) ? '' : String(v);
  const A = v => Array.isArray(v) ? v : [];
  const g = (o, key) => S(o && o[key]);
  return {
    overview: { summary: g(k.overview,'summary'), angle: g(k.overview,'angle'), audience: g(k.overview,'audience') },
    seo: { title: g(k.seo,'title'), meta: g(k.seo,'meta'), keyword: g(k.seo,'keyword'), keywords: A(k.seo && k.seo.keywords).map(S), slug: g(k.seo,'slug') },
    description: { short: g(k.description,'short'), long: g(k.description,'long') },
    points: A(k.points).map(p => ({ t: g(p,'t'), b: g(p,'b') })),
    ads: A(k.ads).map(a => ({ label: g(a,'label'), hook: g(a,'hook'), body: g(a,'body'), cta: g(a,'cta') })),
    tiktok: { hook: g(k.tiktok,'hook'), video: g(k.tiktok,'video'), script: g(k.tiktok,'script'), text: g(k.tiktok,'text'), caption: g(k.tiktok,'caption'), cta: g(k.tiktok,'cta'), tags: A(k.tiktok && k.tiktok.tags).map(S) },
    audience: { who: g(k.audience,'who'), problems: g(k.audience,'problems'), motivation: g(k.audience,'motivation'), howToSell: g(k.audience,'howToSell') },
    imagePrompt: S(k.imagePrompt)
  };
}
function legacyToKit(item){
  return normalizeKit({
    seo: { keywords: Array.isArray(item.keywords) ? item.keywords : [] },
    description: { long: item.seoDescription || '' },
    points: (item.bulletPoints || []).map(b => ({ t: '', b })),
    ads: [{ label: '', body: item.fbAd || '' }],
    tiktok: { script: item.tiktokAd || '' },
    imagePrompt: item.imagePrompt || ''
  });
}
function kitAdText(a){ return a ? [a.hook, a.body, a.cta].filter(Boolean).join('\n') : ''; }

function kitBlock(label, text){
  if(!text) return '';
  const i = kitCopyStore.push(text) - 1;
  const t = translations[currentLang];
  return `<div class="out-card"><div class="out-head"><h3>${escapeHtml(label)}</h3><button type="button" class="btn-outline" onclick="copyKit(${i},this)">${escapeHtml(t.btnCopy)}</button></div><div class="out-body">${escapeHtml(text)}</div></div>`;
}
function kitPanels(kit){
  const L = translations[currentLang].kl;
  const B = kitBlock;
  return [
    B(L.summary, kit.overview.summary) + B(L.angle, kit.overview.angle) + B(L.forWho, kit.overview.audience),
    B(L.seoTitle, kit.seo.title) + B(L.meta, kit.seo.meta) + B(L.keyword, kit.seo.keyword) + B(L.keywords, kit.seo.keywords.join(', ')) + B(L.slug, kit.seo.slug),
    B(L.short, kit.description.short) + B(L.long, kit.description.long),
    kit.points.map((p,i) => B(p.t || ('#' + (i+1)), p.b || p.t)).join(''),
    kit.ads.map((a,i) => B(a.label || ('#' + (i+1)), kitAdText(a))).join(''),
    B(L.hook, kit.tiktok.hook) + B(L.video, kit.tiktok.video) + B(L.script, kit.tiktok.script) + B(L.onScreen, kit.tiktok.text) + B(L.caption, kit.tiktok.caption) + B(L.cta, kit.tiktok.cta) + B(L.hashtags, kit.tiktok.tags.join(' ')),
    B(L.who, kit.audience.who) + B(L.problems, kit.audience.problems) + B(L.motivation, kit.audience.motivation) + B(L.howToSell, kit.audience.howToSell)
  ];
}
function renderKit(){
  if(!currentKit) return;
  const t = translations[currentLang];
  kitCopyStore = [];
  const panels = kitPanels(currentKit);
  document.getElementById('kitTabs').innerHTML = t.kitTabs.map((n,i) => `<button type="button" class="tone-opt${i===activeKitTab?' active':''}" onclick="showKitTab(${i})">${escapeHtml(n)}</button>`).join('');
  document.getElementById('kitPanels').innerHTML = panels.map((h,i) => `<div style="display:${i===activeKitTab?'block':'none'}">${h}</div>`).join('');
  document.getElementById('results').classList.add('show');
}
function showKitTab(i){ activeKitTab = i; renderKit(); }
function copyKit(i, btn){
  navigator.clipboard.writeText(kitCopyStore[i] || '').then(() => {
    const original = btn.textContent;
    btn.textContent = translations[currentLang].btnCopied;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
  });
}
function kitPlainText(kit){
  if(!kit) return '';
  return [kit.overview.summary, kit.description.long, kit.points.map(p => (p.t ? p.t + '. ' : '') + p.b).join('. '), kitAdText(kit.ads[0]), kit.tiktok.script].filter(Boolean).join('. ');
}
function kitPrintHtml(kit, name){
  const L = translations[currentLang].kl;
  const T = translations[currentLang].kitTabs;
  const S = buildPrintSection;
  let h = `<div class="wpp-header"><h1>${escapePrintHtml(name || 'Wassaf')}</h1></div>`;
  h += S(L.summary, kit.overview.summary) + S(L.angle, kit.overview.angle) + S(L.forWho, kit.overview.audience);
  h += S(L.seoTitle, kit.seo.title) + S(L.meta, kit.seo.meta) + S(L.keywords, kit.seo.keywords.join(', '));
  h += S(L.short, kit.description.short) + S(L.long, kit.description.long);
  h += buildPrintBulletsSection(T[3], kit.points.map(p => (p.t ? p.t + ': ' : '') + p.b).join('\n'));
  h += kit.ads.map((a,i) => S(a.label || ('#' + (i+1)), kitAdText(a))).join('');
  h += S('TikTok - ' + L.hook, kit.tiktok.hook) + S(L.video, kit.tiktok.video) + S(L.script, kit.tiktok.script) + S(L.onScreen, kit.tiktok.text) + S(L.caption, kit.tiktok.caption) + S(L.cta, kit.tiktok.cta) + S(L.hashtags, kit.tiktok.tags.join(' '));
  h += S(L.who, kit.audience.who) + S(L.problems, kit.audience.problems) + S(L.motivation, kit.audience.motivation) + S(L.howToSell, kit.audience.howToSell);
  return h;
}

function printResultsAsPDF(kind){
  const t = translations[currentLang];
  const name = kind === 'form'
    ? document.getElementById('pName').value.trim()
    : '';

  let html;
  if(kind === 'form' && currentKit){
    html = kitPrintHtml(currentKit, name);
  } else {
    const seo = document.getElementById('photoSeoOut').textContent;
    const bullets = document.getElementById('photoBulletsPlainHidden').textContent;
    const fb = document.getElementById('photoFbOut').textContent;
    const tiktok = document.getElementById('photoTiktokOut').textContent;
    const strip = s => s.replace(/^[^\u0600-\u06FFA-Za-z]*/,'');
    html = `<div class="wpp-header"><h1>${escapePrintHtml(name || 'Wassaf')}</h1></div>`;
    html += buildPrintSection(strip(t.outSeoTitle), seo);
    html += buildPrintBulletsSection(strip(t.outBulletsTitle), bullets);
    html += buildPrintSection(strip(t.outFbTitle), fb);
    html += buildPrintSection(strip(t.outTiktokTitle), tiktok);
  }

  const area = document.createElement('div');
  area.id = 'wassafPrintArea';
  area.dir = (translations[currentLang].dir === 'rtl') ? 'rtl' : 'ltr';
  area.innerHTML = html;
  document.body.appendChild(area);
  document.body.classList.add('printing-mode');

  const cleanup = () => {
    document.body.classList.remove('printing-mode');
    if(area.parentNode) area.remove();
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
  setTimeout(cleanup, 15000);
}

function openSettingsDrawer(){
  document.getElementById('settingsOverlay').classList.add('show');
  document.getElementById('settingsDrawer').classList.add('show');
}
function closeSettingsDrawer(){
  document.getElementById('settingsOverlay').classList.remove('show');
  document.getElementById('settingsDrawer').classList.remove('show');
}

const TOUR_KEY = 'wassaf_tour_seen';
let tourStepIndex = 0;
function getTourSteps(){
  const t = translations[currentLang];
  return t.tourSteps;
}
function renderTourStep(){
  const t = translations[currentLang];
  const steps = getTourSteps();
  const step = steps[tourStepIndex];
  document.getElementById('tourIcon').textContent = step.icon;
  document.getElementById('tourTitle').textContent = step.title;
  document.getElementById('tourBody').textContent = step.body;
  document.getElementById('tourDots').innerHTML = steps.map((s,i)=>`<div class="tour-dot${i===tourStepIndex?' active':''}"></div>`).join('');
  document.getElementById('tourNextBtn').textContent = (tourStepIndex === steps.length-1) ? t.tourFinish : t.tourNext;
  document.getElementById('tourSkipBtn').textContent = t.tourSkip;
  document.getElementById('tourSkipBtn').style.display = (tourStepIndex === steps.length-1) ? 'none' : 'inline';
}
function nextTourStep(){
  const steps = getTourSteps();
  if(tourStepIndex < steps.length-1){
    tourStepIndex++;
    renderTourStep();
  } else {
    closeTour();
  }
}
function skipTour(){ closeTour(); }
function closeTour(){
  document.getElementById('tourOverlay').classList.remove('show');
  try{ localStorage.setItem(TOUR_KEY, '1'); }catch(e){}
}
function replayTour(){
  tourStepIndex = 0;
  renderTourStep();
  document.getElementById('tourOverlay').classList.add('show');
}
function maybeShowTourOnFirstVisit(){
  let seen = false;
  try{ seen = !!localStorage.getItem(TOUR_KEY); }catch(e){}
  if(!seen){
    tourStepIndex = 0;
    renderTourStep();
    document.getElementById('tourOverlay').classList.add('show');
  }
}

function switchPage(page){
  document.getElementById('pageForm').style.display = page==='form' ? '' : 'none';
  document.getElementById('pagePhoto').style.display = page==='photo' ? '' : 'none';
  document.getElementById('pagePricing').style.display = page==='pricing' ? '' : 'none';
  document.getElementById('pageTabForm').classList.toggle('active', page==='form');
  document.getElementById('pageTabPhoto').classList.toggle('active', page==='photo');
  document.getElementById('pageTabPricing').classList.toggle('active', page==='pricing');
  if(page === 'pricing') loadPricing();
}

let cachedCountry = null;
async function detectCountry(){
  if(cachedCountry) return cachedCountry;
  try{
    const r = await fetch('/api/geo');
    const data = await r.json();
    cachedCountry = data.country || 'EG';
  }catch(e){
    cachedCountry = 'EG';
  }
  return cachedCountry;
}

  EG:'EGP', US:'USD', GB:'GBP', IE:'EUR',
  DE:'EUR', FR:'EUR', ES:'EUR', IT:'EUR', PT:'EUR', NL:'EUR', BE:'EUR', AT:'EUR',
  GR:'EUR', FI:'EUR', LU:'EUR', MT:'EUR', CY:'EUR', SK:'EUR', SI:'EUR', EE:'EUR',
  LV:'EUR', LT:'EUR', HR:'EUR',

  CA:'CAD', AU:'AUD', NZ:'NZD', CH:'CHF', SE:'SEK', NO:'NOK', DK:'DKK', PL:'PLN',
  CZ:'CZK', HU:'HUF', RO:'RON', TR:'TRY', IL:'ILS', ZA:'ZAR', JP:'JPY', CN:'CNY',
  IN:'INR', SG:'SGD', HK:'HKD', KR:'KRW', BR:'BRL', MX:'MXN', MA:'MAD', TN:'TND',

async function loadPricing(){
  const el = document.getElementById('pricingAmount');
  el.textContent = '...';
  const country = await detectCountry();

  if(country === 'EG'){
    el.textContent = '300 EGP';
    return;
  }

  const currency = countryToCurrency[country] || 'USD';
  el.textContent = `25 ${currency}`;
}
async function handleSubscribeClick(){
  const t = translations[currentLang];
  const msgEl = document.getElementById('subscribeMsg');
  msgEl.classList.remove('show');
  msgEl.style.display = 'block';
  if(!currentUser){
    msgEl.textContent = t.subscribeLoginPrompt;
    return;
  }
  const btn = document.getElementById('subscribeBtn');
  btn.disabled = true;
  try{
    const country = await detectCountry();
    const res = await fetch('/api/create-payment', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ country, userId: currentUser.id, email: currentUser.email })
    });
    const data = await res.json().catch(()=>({}));
    if(res.status === 503 || (data && data.error === 'payment_not_ready')){
      msgEl.textContent = t.subscribeNotReady;
    } else if(res.ok && data.paymentUrl){
      window.location.href = data.paymentUrl;
      return;
    } else {
      msgEl.textContent = t.subscribeError;
    }
  }catch(e){
    msgEl.textContent = t.subscribeError;
  }finally{
    btn.disabled = false;
  }
}

async function analyzeFromPhoto(){
  const fileInput = document.getElementById('photoOnlyInput');
  const file = fileInput && fileInput.files && fileInput.files[0];
  const errEl = document.getElementById('analyzeErr');
  const btn = document.getElementById('analyzeBtn');
  const btnLabel = document.getElementById('analyzeBtnLabel');
  const t = translations[currentLang];
  errEl.style.display = 'none';

  const showAnalyzeErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };
  const allowed = await checkUsageAndAuth(showAnalyzeErr);
  if(!allowed) return;

  if(!file){
    errEl.textContent = t.analyzeErrNoFile;
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btnLabel.innerHTML = `<span class="spinner"></span> ${t.btnAnalyzing}`;
  document.getElementById('photoResults').classList.remove('show');

  const imgOut = document.getElementById('photoAdImage');
  const imgLoading = document.getElementById('photoImgLoading');
  imgOut.style.display = 'none';
  imgLoading.style.display = 'block';
  imgLoading.textContent = t.imgLoadingText;

  try{
    const base64 = await resizeImageFile(file, 1024);
    const langName = t.langName;

    const textRes = await fetch('/api/analyze-image', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: base64, langName })
    });
    const textData = await textRes.json();
    if(!textRes.ok){ throw new Error((textData.error && textData.error.message) || 'analyze failed'); }
    const raw = (textData.content||[]).map(b=>b.text||'').join('\n').trim();
    const data = parseSections(raw);

    document.getElementById('photoSeoOut').textContent = data.seoDescription || '';
    document.getElementById('photoKwWrap').innerHTML = (data.keywords||[]).map(k=>`<span class="kw">${escapeHtml(k)}</span>`).join('');
    document.getElementById('photoBulletsOut').innerHTML = (data.bulletPoints||[]).map(b=>`<li>${escapeHtml(b)}</li>`).join('');
    document.getElementById('photoBulletsPlainHidden').textContent = (data.bulletPoints||[]).map(b=>'• '+b).join('\n');
    document.getElementById('photoFbOut').textContent = data.fbAd || '';
    document.getElementById('photoTiktokOut').textContent = data.tiktokAd || '';
    document.getElementById('photoResults').classList.add('show');
    document.getElementById('photoResults').scrollIntoView({behavior:'smooth', block:'start'});

    imgLoading.textContent = t.imgBgRemovalText;
    try{
      const studioUrl = await makeStudioAdFromFile(file);
      imgOut.src = studioUrl;
      imgOut.style.display = 'block';
      imgLoading.style.display = 'none';
    }catch(e){
      console.error(e);
      imgLoading.textContent = t.imgErrText;
    }

  }catch(e){
    errEl.textContent = t.errPrefix + (e.message || '?') + t.errSuffix;
    errEl.style.display = 'block';
    imgLoading.style.display = 'none';
  }finally{
    btn.disabled = false;
    btnLabel.textContent = t.btnAnalyze;
  }
}

  const lang = await loadLang();
  setLanguage(lang);
  maybeShowTourOnFirstVisit();
})();
